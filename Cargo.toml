[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/bitbrew-dev/libfmp"
license = "MIT"

[workspace.dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
http = "1.5.0"
libc = "0.2.189"
libfmp = { path = "crates/libfmp" }
pyo3 = { version = "0.29", features = ["abi3-py310", "chrono"] }
pyo3-stub-gen = { version = "0.23", default-features = false, features = ["infer_signature"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5.8"
