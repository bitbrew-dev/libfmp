args = [
    { name = "symbol", kind = "ticker" },
    { name = "limit", kind = "limit", required = false },
    { name = "include_report_times", kind = "boolean", required = false },
]
setters = [{ arg = "limit" }, { arg = "include_report_times" }]

[[endpoint]]
name = "earnings_calendar"
