# Endpoint registry for the `calendar` domain, reached from Python as
# `client.calendar`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "dividends"
method = "dividends"
query = "DividendsQuery"
response = "calendar::DividendEvent"
doc = "Retrieves worldwide dividend events for one company."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "limit", kind = "limit", required = false },
]
setters = [{ arg = "limit" }]

[[endpoint]]
name = "dividends_calendar"
method = "dividends_calendar"
query = "DividendsCalendarQuery"
response = "calendar::DividendEvent"
doc = "Retrieves the worldwide dividend calendar."
args = [
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
    { name = "page", kind = "page", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }, { arg = "page" }]

[[endpoint]]
name = "earnings"
