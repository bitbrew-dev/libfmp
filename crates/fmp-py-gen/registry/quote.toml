# Endpoint registry for the `quote` domain, reached from Python as
# `client.quote`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "full"
method = "quote"
query = "QuoteQuery"
response = "quote::Quote"
doc = "The full quote for a symbol."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "short"
method = "quote_short"
query = "QuoteShortQuery"
response = "quote::QuoteShort"
doc = "The compact quote array for a symbol."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "mutual_funds"
method = "mutual_fund_quotes"
response = "quote::QuoteShort"
doc = "Compact quotes for every mutual fund, without a query."

[[endpoint]]
name = "aftermarket_trade"
method = "aftermarket_trade"
query = "AftermarketTradeQuery"
response = "quote::AftermarketTrade"
doc = "Retrieves US aftermarket trades for one ticker."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "aftermarket_quote"
method = "aftermarket_quote"
query = "AftermarketQuoteQuery"
response = "quote::AftermarketQuote"
doc = "Retrieves US aftermarket bid-and-ask quotes for one ticker."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "stock_price_change"
method = "stock_price_change"
query = "StockPriceChangeQuery"
response = "quote::StockPriceChange"
doc = "Retrieves worldwide percentage price changes for one stock."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "batch_quote"
method = "batch_quote"
query = "BatchQuoteQuery"
response = "quote::Quote"
doc = "Retrieves detailed worldwide stock quotes for multiple tickers."
args = [{ name = "symbols", kind = "ticker_list" }]

[[endpoint]]
name = "batch_quote_short"
method = "batch_quote_short"
query = "BatchQuoteShortQuery"
response = "quote::QuoteShort"
doc = "Retrieves compact worldwide stock quotes for multiple tickers."
args = [{ name = "symbols", kind = "ticker_list" }]

[[endpoint]]
name = "batch_aftermarket_trade"
method = "batch_aftermarket_trade"
query = "BatchAftermarketTradeQuery"
response = "quote::AftermarketTrade"
doc = "Retrieves US aftermarket trades for multiple tickers."
args = [{ name = "symbols", kind = "ticker_list" }]

[[endpoint]]
name = "batch_aftermarket_quote"
method = "batch_aftermarket_quote"
query = "BatchAftermarketQuoteQuery"
response = "quote::AftermarketQuote"
doc = "Retrieves US aftermarket bid-and-ask quotes for multiple tickers."
args = [{ name = "symbols", kind = "ticker_list" }]

[[endpoint]]
name = "exchange"
method = "exchange_quotes"
query = "ExchangeQuotesQuery"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for every stock on one exchange."
args = [{ name = "exchange", kind = "exchange_code" }]

[[endpoint]]
name = "etfs"
method = "etf_quotes"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for the documented ETF universe."

[[endpoint]]
name = "commodities"
method = "commodity_quotes"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for the documented commodity universe."

[[endpoint]]
name = "cryptocurrencies"
method = "cryptocurrency_quotes"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for the documented cryptocurrency universe."

[[endpoint]]
name = "forex"
method = "forex_quotes"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for the documented forex universe."

[[endpoint]]
name = "indexes"
method = "index_quotes"
response = "quote::QuoteShort"
doc = "Retrieves compact quotes for the documented index universe."
