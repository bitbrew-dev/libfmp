[[namespace]]
path = "statements.reports"

[[namespace.endpoint]]
name = "dates"
method = "financial_reports_dates"
query = "FinancialReportsDatesQuery"
response = "statements::reports::FinancialReportDate"
doc = "Retrieves available financial-report periods and protected download links."
args = [{ name = "symbol", kind = "ticker" }]

[[namespace.endpoint]]
name = "json"
method = "financial_reports_json"
query = "FinancialReportsJsonQuery"
response = "statements::reports::FinancialReportJson"
single = true
doc = "Retrieves one dynamic JSON financial report as a single object."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "year", kind = "year" },
    { name = "period", kind = "fiscal_period" },
]

[[namespace.endpoint]]
name = "xlsx"
method = "financial_reports_xlsx"
query = "FinancialReportsXlsxQuery"
binary = true
doc = "Downloads one financial report using the endpoint's XLSX MIME policy."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "year", kind = "year" },
    { name = "period", kind = "fiscal_period" },
]

