# Endpoint registry for the `statements` domain, reached from Python as
# `client.statements.<sub>`. Validate with
# `cargo run -p fmp-py-gen --bin registry_check`.

[[namespace]]
path = "statements.income"

[[namespace.endpoint]]
name = "statement"
method = "income_statement"
query = "IncomeStatementQuery"
response = "statements::income::IncomeStatement"
doc = "Retrieves historical worldwide income statements for one company."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "limit", kind = "limit", required = false },
    { name = "period", kind = "statement_period", required = false },
]
setters = [{ arg = "limit" }, { arg = "period" }]

[[namespace.endpoint]]
name = "statement_ttm"
method = "income_statement_ttm"
query = "IncomeStatementTtmQuery"
response = "statements::income::IncomeStatement"
doc = "Retrieves trailing-twelve-month worldwide income statements for one company."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "limit", kind = "limit", required = false },
]
setters = [{ arg = "limit" }]

