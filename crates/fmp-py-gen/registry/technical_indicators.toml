# Endpoint registry for the `technical_indicators` domain, reached from Python
# as `client.technical_indicators`. Validate with
# `cargo run -p fmp-py-gen --bin registry_check`.
#
# All nine methods share `TechnicalIndicatorQuery`: a required ticker, a
# strictly positive look-back period length, a chart timeframe, and the two
# optional independent dates.

[[endpoint]]
name = "simple_moving_average"
method = "simple_moving_average"
query = "TechnicalIndicatorQuery"
response = "technical_indicators::SimpleMovingAverageBar"
doc = "Retrieves worldwide simple-moving-average bars."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "period_length", kind = "period_length" },
    { name = "timeframe", kind = "chart_timeframe" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

