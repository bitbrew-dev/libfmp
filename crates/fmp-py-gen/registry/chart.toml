# Endpoint registry for the `chart` domain, reached from Python as
# `client.chart`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "light"
method = "stock_chart_light"
query = "StockChartEodQuery"
response = "chart::StockChartLightBar"
doc = "Retrieves compact worldwide end-of-day stock chart rows."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

