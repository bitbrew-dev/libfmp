# Endpoint registry for the `forex` domain, reached from Python as
# `client.forex`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "list"
method = "forex_list"
response = "forex::ForexPair"
doc = "Lists the provider's documented forex pairs."

[[endpoint]]
name = "quote"
method = "forex_quote"
query = "QuoteQuery"
response = "quote::Quote"
doc = "Retrieves a detailed US-only quote for one forex pair."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "quote_short"
method = "forex_quote_short"
query = "QuoteShortQuery"
response = "quote::QuoteShort"
doc = "Retrieves a compact US-only quote for one forex pair."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "chart_light"
method = "forex_chart_light"
query = "AssetChartQuery"
response = "chart::StockChartLightBar"
doc = "Retrieves compact end-of-day forex history."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

[[endpoint]]
name = "chart_full"
method = "forex_chart_full"
query = "AssetChartQuery"
response = "chart::StockChartFullBar"
doc = "Retrieves detailed end-of-day forex history."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

[[endpoint]]
