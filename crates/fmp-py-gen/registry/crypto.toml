# Endpoint registry for the `crypto` domain, reached from Python as
# `client.crypto`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "list"
method = "cryptocurrency_list"
response = "crypto::CryptocurrencyListing"
doc = "Lists the provider's documented cryptocurrency catalog."

[[endpoint]]
name = "quote"
method = "cryptocurrency_quote"
query = "QuoteQuery"
response = "quote::Quote"
doc = "Retrieves a detailed quote for one cryptocurrency."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "quote_short"
method = "cryptocurrency_quote_short"
query = "QuoteShortQuery"
response = "quote::QuoteShort"
doc = "Retrieves a compact quote for one cryptocurrency."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "chart_light"
method = "cryptocurrency_chart_light"
query = "AssetChartQuery"
response = "chart::StockChartLightBar"
doc = "Retrieves compact end-of-day cryptocurrency history."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

[[endpoint]]
name = "chart_full"
method = "cryptocurrency_chart_full"
query = "AssetChartQuery"
response = "chart::StockChartFullBar"
doc = "Retrieves detailed end-of-day cryptocurrency history."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

[[endpoint]]
