# Endpoint registry for the `market` domain, reached from Python as
# `client.market`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "sector_performance_snapshot"
method = "sector_performance_snapshot"
query = "SectorPerformanceSnapshotQuery"
response = "market::SectorPerformance"
doc = "Retrieves a worldwide dated sector-performance snapshot."
args = [
    { name = "date", kind = "date" },
    { name = "exchange", kind = "exchange_code", required = false },
    { name = "sector", kind = "sector", required = false },
]
setters = [{ arg = "exchange" }, { arg = "sector" }]

