args = [{ name = "year", kind = "year" }, { name = "period", kind = "fiscal_period" }]

[[endpoint]]
name = "eod"
method = "bulk_eod"
query = "BulkEodQuery"
response = "bulk::eod::BulkEodBar"
doc = "Retrieves worldwide bulk end-of-day prices for one required date."
args = [{ name = "date", kind = "date" }]
