# Endpoint registry for the `indexes` domain, reached from Python as
# `client.indexes`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "list"
method = "index_list"
response = "indexes::IndexListing"
doc = "Lists worldwide stock-market indexes."

[[endpoint]]
name = "quote"
method = "index_quote"
query = "QuoteQuery"
response = "quote::Quote"
doc = "Retrieves a detailed quote for one stock-market index."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "quote_short"
method = "index_quote_short"
query = "QuoteShortQuery"
response = "quote::QuoteShort"
doc = "Retrieves a compact quote for one stock-market index."
args = [{ name = "symbol", kind = "ticker" }]

[[endpoint]]
name = "chart_light"
method = "index_chart_light"
query = "IndexChartQuery"
response = "chart::StockChartLightBar"
doc = "Retrieves compact end-of-day history for one stock-market index."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

[[endpoint]]
name = "chart_full"
method = "index_chart_full"
query = "IndexChartQuery"
response = "chart::StockChartFullBar"
doc = "Retrieves detailed end-of-day history for one stock-market index."
args = [
    { name = "symbol", kind = "ticker" },
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }]

