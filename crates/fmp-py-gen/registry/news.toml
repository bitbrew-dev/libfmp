# Endpoint registry for the `news` domain, reached from Python as
# `client.news`. Validate with `cargo run -p fmp-py-gen --bin registry_check`.

[[endpoint]]
name = "articles"
method = "articles"
query = "ArticlesQuery"
response = "news::Article"
doc = "Retrieves US-authored Financial Modeling Prep articles."
args = [
    { name = "page", kind = "page", required = false },
    { name = "limit", kind = "limit", required = false },
]
setters = [{ arg = "page" }, { arg = "limit" }]

[[endpoint]]
name = "latest_general_news"
method = "latest_general_news"
query = "LatestGeneralNewsQuery"
response = "news::NewsArticle"
doc = "Retrieves the latest worldwide general-news articles."
args = [
    { name = "from", kind = "date", required = false },
    { name = "to", kind = "date", required = false },
    { name = "page", kind = "page", required = false },
    { name = "limit", kind = "limit", required = false },
]
setters = [{ arg = "from" }, { arg = "to" }, { arg = "page" }, { arg = "limit" }]

