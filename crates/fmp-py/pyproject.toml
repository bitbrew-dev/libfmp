[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fmp-py-sdk"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Typed Python bindings for Financial Modeling Prep, powered by libfmp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["finance", "market-data", "fmp", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/bitbrew-dev/libfmp/blob/main/crates/fmp-py/README.md"
Issues = "https://github.com/bitbrew-dev/libfmp/issues"
Repository = "https://github.com/bitbrew-dev/libfmp"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
module-name = "fmp._native"
python-source = "python"

[tool.pyo3-stub-gen]
generate-init-py = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
ignore = ["E731"]
# exclude = ["ALL"]
select = ["D1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
