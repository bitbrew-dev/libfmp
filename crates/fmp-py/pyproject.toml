[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fmp-py-sdk"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Typed Python bindings for Financial Modeling Prep, powered by libfmp"
readme = "README.md"
keywords = ["finance", "market-data", "fmp", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/bitbrew-dev/libfmp/blob/main/crates/fmp-py/README.md"
Issues = "https://github.com/bitbrew-dev/libfmp/issues"
Repository = "https://github.com/bitbrew-dev/libfmp"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
module-name = "fmp_py._native"
python-source = "python"
