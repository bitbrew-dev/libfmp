[package]
name = "libfmp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Async, typed Rust client for the Financial Modeling Prep API"
readme = "README.md"
documentation = "https://docs.rs/libfmp"
keywords = ["finance", "market-data", "fmp", "api", "sdk"]
categories = ["api-bindings", "finance"]
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
path = "src/lib.rs"

[dependencies]
bytes.workspace = true
chrono.workspace = true
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
