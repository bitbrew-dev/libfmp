name: pull-request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit checks
    uses: bitbrew-dev/r-workflows/.github/workflows/prek.yml@main
    # uses: bitbrew-dev/reusable-workflows/.github/workflows/prek.yml@main
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      prek_skip: fmt,check,clippy,test

  check-change-files:
    name: check-changed-files
    outputs:
      tests: ${{ steps.check-changes.outputs.tests_any_modified }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: get rust modules that have changed
        id: check-changes
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32 # v46.0.1
        with:
          files_yaml: |
            tests:
              - src/**/*.rs
              - tests/**/*.rs
              - .github/workflows/*.yml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml

  rust-ci:
    name: rust ci
    runs-on: ubuntu-latest
    needs: check-change-files
    if: needs.check-change-files.outputs.tests == 'true'
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
          cargo install nu@0.115.1 --locked
          zsh --version
          nu --version
          pwsh --version
      - name: check formatting
        run: cargo fmt --all -- --check
      - name: run cargo check
        run: cargo check --verbose
      - name: run clippy
        run: cargo clippy --verbose -- -D warnings
      - name: build binary
        run: cargo build --verbose
      - name: run test
        run: cargo test --verbose
    env:
      CARGO_TERM_COLOR: always
      CJ_REQUIRE_SHELLS: "1"

  python-bindings:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install maturin and pytest
        run: pip install --no-cache-dir maturin pytest

      - name: build and install the itofin extension module
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          maturin develop -m crates/fmp-py/Cargo.toml

      - name: run the pytest oracle
        run: |
          . .venv/bin/activate
          pytest crates/fmp-py/tests -v

  pr-labeler:
    name: pr labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: pr labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
