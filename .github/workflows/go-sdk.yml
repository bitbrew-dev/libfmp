name: Go SDK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - 'scripts/check_go_sdk.sh'
      - 'scripts/check_go_coverage.py'
      - 'scripts/check_go_coverage_test.py'
      - '.github/workflows/go-sdk.yml'
      - 'crates/libfmp/tests/fixtures/**'
      - 'crates/fmp-py-gen/**'
      - 'crates/libfmp/src/responses/**'
      - 'crates/libfmp/src/endpoints/**'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - 'sdk/go/**'
      - 'scripts/check_go_sdk.sh'
      - 'scripts/check_go_coverage.py'
      - 'scripts/check_go_coverage_test.py'
      - '.github/workflows/go-sdk.yml'
      - 'crates/libfmp/tests/fixtures/**'
      - 'crates/fmp-py-gen/**'
      - 'crates/libfmp/src/responses/**'
      - 'crates/libfmp/src/endpoints/**'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: go sdk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: set up the go version pinned in sdk/go/go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: install golangci-lint v2
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: run the go sdk checks
        run: bash scripts/check_go_sdk.sh
