name: semantic-release

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "If you are sure to launch a new release, put the value to true."
        default: "false"
        required: true
        type: choice
        options:
          - "true"
          - "false"

jobs:
  semantic-release:
    name: semantic-release
    if: ${{ inputs.prompt == 'true' }}
    uses: bitbrew-dev/reusable-workflows/.github/workflows/semantic-release.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      packages: read
    secrets: inherit
    with:
      new_version_title: "📈 LibFMP"

  publish-crate:
    name: publish libfmp to crates.io
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token crates.io trusted publishing verifies
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: sync the workspace version to the release tag
        run: |
          VER="${{ needs.semantic-release.outputs.new_release_tag }}"
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${VER}\"/" Cargo.toml
          grep -E "^version" Cargo.toml
      - name: authenticate to crates.io via OIDC trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p libfmp --allow-dirty

  build-python-wheels:
    name: build fmp wheels (${{ matrix.os }})
    needs: semantic-release
    if: ${{ needs.semantic-release.outputs.new_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - name: sync the workspace version to the release tag
        shell: bash
        env:
          VER: ${{ needs.semantic-release.outputs.new_release_tag }}
        run: |
          python3 -c "import re,pathlib,os; v=os.environ['VER']; p=pathlib.Path('Cargo.toml'); p.write_text(re.sub(r'(?m)^version = \"[0-9]+\.[0-9]+\.[0-9]+\"', f'version = \"{v}\"', p.read_text()))"
          grep -qF "version = \"${VER}\"" Cargo.toml || { echo "version sync failed: workspace version does not match ${VER}"; exit 1; }
          grep -E "^version" Cargo.toml
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m crates/fmp-py/Cargo.toml
          manylinux: auto
      - name: build sdist
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/fmp-py/Cargo.toml
      - name: upload the built distributions
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  publish-pypi:
    name: publish fmp to PyPI
    needs: [semantic-release, build-python-wheels]
    if: ${{ needs.semantic-release.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token PyPI trusted publishing verifies
    environment: pypi
    steps:
      - name: download all built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # For a TestPyPI dry-run, register a separate TestPyPI trusted publisher,
        # then uncomment the override below (and remove it for the real publish):
        # with:
        #   repository-url: https://test.pypi.org/legacy/

  publish-go-tag:
    name: tag the Go module (sdk/go/vX.Y.Z)
    needs: [semantic-release, publish-crate, publish-pypi]
    if: ${{ needs.semantic-release.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sdk/go/vX.Y.Z tag with the workflow token
    env:
      VER: ${{ needs.semantic-release.outputs.new_release_tag }}
    steps:
      - name: checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_tag }}
      - name: assert the checkout carries the Go module at the release version
        shell: bash
        run: |
          test -f sdk/go/go.mod || { echo "sdk/go/go.mod is missing at ${VER}"; exit 1; }
          grep -qF 'module github.com/bitbrew-dev/libfmp/sdk/go' sdk/go/go.mod || { echo "sdk/go/go.mod does not declare the expected module path"; exit 1; }
          grep -qxF "const Version = \"${VER}\"" sdk/go/version.go || {
            echo "sdk/go/version.go does not carry Version = \"${VER}\" at the release commit; the Go tag cannot be created (the release commit must include the set-version.sh output)"
            grep -n 'const Version' sdk/go/version.go
            exit 1
          }
      - name: create and push sdk/go/v${{ needs.semantic-release.outputs.new_release_tag }}
        shell: bash
        run: |
          GO_TAG="sdk/go/v${VER}"
          commit="$(git rev-parse HEAD)"
          # Idempotent: an existing tag at this commit is a no-op (a rerun of
          # the workflow); one at another commit is never moved, because the
          # module proxy serves a fetched version forever once the repository
          # is public.
          if git ls-remote --exit-code --tags origin "refs/tags/${GO_TAG}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/${GO_TAG}:refs/tags/${GO_TAG}"
            existing="$(git rev-parse "refs/tags/${GO_TAG}^{commit}")"
            if [[ "${existing}" == "${commit}" ]]; then
              echo "${GO_TAG} already points at ${commit}; nothing to do"
              exit 0
            fi
            echo "${GO_TAG} already exists at ${existing}, not ${commit}; refusing to move it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${GO_TAG}" -m "Go module github.com/bitbrew-dev/libfmp/sdk/go v${VER} (release ${VER})" "${commit}"
          git push origin "refs/tags/${GO_TAG}"
          echo "pushed ${GO_TAG} at ${commit}"
      - name: set up the go version pinned in sdk/go/go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: detect repository visibility
        id: visibility
        shell: bash
        # workflow_dispatch does not guarantee github.event.repository.private,
        # so ask the API. The value gates the proxy warm-up below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          case "${private}" in
            true|false) ;;
            *) echo "unexpected visibility value '${private}' for ${GITHUB_REPOSITORY}"; exit 1 ;;
          esac
          echo "private=${private}" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REPOSITORY} private=${private}"
      - name: verify the tag resolves as a Go module (direct)
        shell: bash
        # Always runs: a direct VCS fetch with the workflow token proves the
        # nested-module tag is well formed whether or not the repository is
        # public. The token goes into a scratch git config, never into logs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-go-direct
          GOPROXY: direct
          GOPRIVATE: github.com/bitbrew-dev/*
          GONOSUMDB: github.com/bitbrew-dev/*
          GOFLAGS: -mod=mod
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          cd "${RUNNER_TEMP}"
          resolved="$(go list -m -f '{{.Version}}' "github.com/bitbrew-dev/libfmp/sdk/go@v${VER}")"
          if [[ "${resolved}" != "v${VER}" ]]; then
            echo "direct resolution returned '${resolved}', expected 'v${VER}'"
            exit 1
          fi
          echo "github.com/bitbrew-dev/libfmp/sdk/go@${resolved} resolves directly"
      - name: resolve the version through the public module proxy
        if: steps.visibility.outputs.private == 'false'
        shell: bash
        # Public repository only: this fetch makes proxy.golang.org cache
        # sdk/go/v${VER}; from here on the version is immutable. The tag is
        # already pushed and verified directly, so a proxy timeout here is
        # safe to rerun: the tag step is idempotent.
        env:
          GOPROXY: https://proxy.golang.org
          GONOSUMDB: "*"
          GOFLAGS: -mod=mod
        run: |
          cd "${RUNNER_TEMP}"
          go list -m "github.com/bitbrew-dev/libfmp/sdk/go@v${VER}"
      - name: note the skipped proxy warm-up
        if: steps.visibility.outputs.private == 'true'
        shell: bash
        run: |
          echo "::notice::repository is private; skipped proxy.golang.org warm-up, consumers need GOPRIVATE=github.com/bitbrew-dev/*"
